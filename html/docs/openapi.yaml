        sample_cis:
          type: array
          items:
            type: integer
          examples: [[60012345, 60023456]]
          title: Exemples de CIS concernés
    AnsmDocument:
      type: object
      title: AnsmDocument
      description: |
        Document ANSM (RCP ou notice patient) sectionné, servi par
        `/v1/medicaments/{cis}/rcp` et `/v1/medicaments/{cis}/notice`.
        Les champs `source` et `miseAJour` sont obligatoires dans chaque
        réponse (attribution requise par la licence Etalab 2.0 sur les
        données ANSM).
      properties:
        cis:
          type: string
          pattern: "^[0-9]{1,10}$"
          title: Code CIS du médicament
        type:
          type: string
          enum: ["rcp", "notice"]
          title: Type de document
        titre:
          type: string
          title: Titre du médicament tel que publié par l'ANSM
        miseAJour:
          type: string
          format: date
          title: Date de mise à jour ANSM du document (YYYY-MM-DD)
        source:
          type: string
          title: Attribution de la source (ANSM - Base de données publique des médicaments)
        sections:
          type: array
          title: Sections du document dans l'ordre de publication
          items:
            $ref: "#/components/schemas/AnsmDocumentSection"
      required: ["cis", "type", "titre", "miseAJour", "source", "sections"]
    AnsmDocumentSection:
      type: object
      title: AnsmDocumentSection
      description: |
        Une rubrique du document. Pour les RCP, `id` suit la numérotation
        canonique (1 à 12, 4.1 à 4.9...) ; pour les notices, `id` est
        dérivé du titre de la rubrique (slug).
      properties:
        id:
          type: string
          title: Identifiant stable de la section
        titre:
          type: string
          title: Titre de la rubrique
        contenu:
          type: string
          title: Contenu HTML sanitisé (liste blanche stricte : p, strong, em, table, ul/ol/li...)
