components:
  parameters:
    QueryPage:
      name: page
      in: query
      required: false
      description: Numéro de page (pagination à 10 éléments par page par défaut, utilisable avec pageSize)
      schema:
        type: integer
        minimum: 1
    QueryPageSize:
      name: pageSize
      in: query
      required: false
      description: |
        Nombre d'éléments par page. Plage valide: 1-200.
        Valeur par défaut: 10 éléments.
        Doit être utilisé avec le paramètre page (mutuellement exclusif avec search/cip/libelle).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 10
    QuerySearch:
      name: search
      in: query
      required: false
      description: |
        Terme de recherche multi-mots (1-6 mots requis, logique ET).
        Les mots sont séparés par + ou espace dans l'URL.
        Minimum 3 caractères, maximum 50 caractères.
        Maximum 250 résultats par recherche (erreur 400 « Search too broad » si dépassé ; utilisez /v1/medicaments/export pour l'ensemble des données).
        La recherche est insensible aux accents et à la casse : « comprime » trouve « COMPRIMÉ » et « comprimé » trouve « comprime ».
      schema:
        type: string
        minLength: 3
        maxLength: 50
        pattern: "^[a-zA-Z0-9àâäéèêëïîôöùûüÿçÀÂÄÉÈÊËÏÎÔÖÙÛÜŸÇ\\s\\-\\.\\+/']+$"
    QueryCip:
      name: cip
      in: query
      required: false
      description: Code CIP (CIP7 ou CIP13)
      schema:
        type: string
        pattern: "^[0-9]{7}|[0-9]{13}$"
    QueryLibelle:
      name: libelle
      in: query
      required: false
      description: |
        Terme de recherche multi-mots (1-6 mots requis, logique ET).
        Les mots sont séparés par + ou espace dans l'URL.
        Minimum 3 caractères, maximum 50 caractères.
        Maximum 100 résultats par recherche (erreur 400 « Search too broad » si dépassé ; utilisez /v1/medicaments/export pour l'ensemble des données).
        La recherche est insensible aux accents et à la casse : « solute » trouve « SOLUTÉ ».
      schema:
        type: string
        minLength: 3
        maxLength: 50
        pattern: "^[a-zA-Z0-9àâäéèêëïîôöùûüÿçÀÂÄÉÈÊËÏÎÔÖÙÛÜŸÇ\\s\\-\\.\\+/']+$"
    QueryGroup:
      name: group
      in: query
      required: false
      description: ID de groupe (entier positif)
      schema:
        type: integer
        minimum: 1
        maximum: 99999
    PathCis:
      name: cis
      in: path
      required: true
      description: Code CIS
      schema:
        type: string
        pattern: "^[0-9]{1,9}$"
    PathCip:
      name: cip
      in: path
      required: true
      description: Code CIP (CIP7 ou CIP13)
      schema:
        type: string
        pattern: "^[0-9]{7}|[0-9]{13}$"
    PathGroupID:
      name: groupID
      in: path
      required: true
      description: ID de groupe (entier positif inférieur à 100 000)
      schema:
        type: integer
        minimum: 1
        maximum: 99999
  schemas:
