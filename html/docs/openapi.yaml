openapi: 3.1.1
info:
  title: API Médicaments FR
  description: |
    API haute performance pour accéder aux données des médicaments français issus de la Base de Données Publique des Médicaments (BDPM).

    **Caractéristiques principales :**
    - Données officielles mises à jour automatiquement 2 fois par jour (6h et 18h)
    - Accès gratuit avec rate limiting équitable (1000 tokens initiaux, recharge à 3 tokens/sec)
    - Recherches plafonnées : 250 résultats max pour `/v1/medicaments?search=`, 100 max pour `/v1/generiques?libelle=` (erreur 400 au-delà) — `/v1/medicaments/export` pour l'ensemble des données
    - Données intègres et non altérées depuis la source BDPM
    - Endpoints v1 modernes + endpoints legacy (supprimés le 31 juillet 2026, désormais 410 Gone)

    **Remarque :** Les endpoints legacy ont été supprimés le 31 juillet 2026 et répondent désormais `410 Gone`. Chaque réponse inclut un header `Link; rel="successor-version"` indiquant l'endpoint v1 de remplacement.

    **Ressources utiles:**
    - [Guide de migration vers v1](https://github.com/Giygas/medicaments-api/blob/main/docs/MIGRATION.md)
    - [Base de données BDPM](https://base-donnees-publique.medicaments.gouv.fr)

  version: 2.2.0
  contact:
    name: GitHub Repository
    url: https://github.com/giygas/medicaments-api
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: https://medicaments-api.giygas.dev/

security: []

tags:
  - name: Médicaments (v1)
    description: Points de terminaison v1 liés aux médicaments
  - name: Génériques (v1)
    description: Points de terminaison v1 des groupes de médicaments génériques
  - name: Présentations (v1)
    description: Points de terminaison v1 des présentations de médicaments
  - name: Système
    description: Points de terminaison de santé et d'état du système
  - name: Médicaments (Legacy)
    description: Points de terminaison legacy liés aux médicaments (supprimés, 410 Gone)
  - name: Génériques (Legacy)
    description: Points de terminaison legacy des groupes de médicaments génériques (supprimés, 410 Gone)

paths:
  /v1/medicaments:
    get:
      summary: Obtenir des médicaments (v1)
      description: |
        Recherche et récupération de médicaments avec différents paramètres de requête.
        Seul un paramètre est autorisé à la fois.
      tags:
        - Médicaments (v1)
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryPageSize"
        - $ref: "#/components/parameters/QuerySearch"
        - $ref: "#/components/parameters/QueryCip"
      responses:
        "200":
          description: Réponse réussie
          headers:
            ETag:
              schema:
                type: string
              examples:
                etag-header:
                  value: 'W/"abc123"'
            Last-Modified:
              schema:
                type: string
                format: date-time
              examples:
                last-modified-header:
                  value: "Mon, 15 Jan 2026 06:00:00 GMT"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MedicamentArray"
                  - $ref: "#/components/schemas/PaginatedMedicament"
              examples:
                paginated:
                  summary: Pagination
                  value:
                    data:
                      - cis: 61504672
                        elementPharmaceutique: "PARACETAMOL MYLAN 1 g, comprimé"
                        formePharmaceutique: "comprimé"
                        voiesAdministration: ["orale"]
                        statusAutorisation: "Autorisation active"
                        typeProcedure: "Procédure nationale"
                        etatComercialisation: "Commercialisée"
                        dateAMM: "2000-01-01"
                        titulaire: "MYLAN SAS"
                        surveillanceRenforcee: "Non"
                        composition: []
                        generiques: []
                        presentation: []
                        conditions: []
                    page: 1
                    pageSize: 10
                    totalItems: 15000
                    maxPage: 1500
                search:
                  summary: Recherche par nom
                  value:
                    - cis: 61504672
                      elementPharmaceutique: "PARACETAMOL MYLAN 1 g, comprimé"
                      formePharmaceutique: "comprimé"
                      voiesAdministration: ["orale"]
                      statusAutorisation: "Autorisation active"
                      typeProcedure: "Procédure nationale"
                      etatComercialisation: "Commercialisée"
                      dateAMM: "2000-01-01"
                      titulaire: "MYLAN SAS"
                      surveillanceRenforcee: "Non"
                      composition: []
                      generiques: []
                      presentation: []
                      conditions: []
                    - cis: 60001234
                      elementPharmaceutique: "DOLIPRANE 1000 mg, comprimé"
                      formePharmaceutique: "comprimé"
                      voiesAdministration: ["orale"]
                      statusAutorisation: "Autorisation active"
                      typeProcedure: "Procédure nationale"
                      etatComercialisation: "Commercialisée"
                      dateAMM: "1998-05-15"
                      titulaire: "SANOFI AVENTIS FRANCE"
                      surveillanceRenforcee: "Non"
                      composition: []
                      generiques: []
                      presentation: []
                      conditions: []
        "400":
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad-request:
                  value:
                    error: "Bad Request"
                    message: "Only one parameter allowed at a time"
                    code: 400
                search-too-broad:
                  summary: Recherche trop large
                  value:
                    error: "Bad Request"
                    message: "Search too broad. Maximum 250 results returned. Use more specific search terms or /export for full dataset"
                    code: 400
                word-limit-exceeded:
                  summary: Limite de mots dépassée
                  value:
                    error: "Bad Request"
                    message: "search query too complex: maximum 6 words allowed"
                    code: 400
                consecutive-dots:
                  summary: Points consécutifs non autorisés
                  value:
                    error: "Bad Request"
                    message: "input contains consecutive dots which are not allowed"
                    code: 400
        "404":
          description: Aucun résultat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not-found:
                  value:
                    error: "Not Found"
                    message: "No medicaments found"
                    code: 404
        "500":
          description: Erreur interne du serveur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-error:
                  value:
                    error: "Internal Server Error"
                    message: "Internal server error"
                    code: 500

