          title: Statut d'agrément
        tauxRemboursement:
          type: string
          title: Taux de remboursement
        prix:
          type: number
          format: double
          title: Prix
          deprecated: true
          description: "Prix. Retourne `0` lorsque la source ne déclare pas de prix (≈35 % des présentations) — **sunset : `prix` retournera `null` au 2026-12-31 (v3.0.0)**. Pendant la transition, détectez l'absence par `prix == 0 || prix == null`."
        prixPublic:
          type: ["number", "null"]
          format: double
          title: Prix public
          description: "Prix public (prix + honoraires de dispensation). `null` lorsque la source ne déclare pas de prix."
          description: Prix public. `null` lorsque la source ne déclare pas de prix.
        honorairesDispensation:
          type: ["number", "null"]
          format: double
          title: Honoraires de dispensation
          description: Honoraires de dispensation. `null` lorsque la source ne déclare pas de prix.

    GeneriqueListResponse:
      type: object
      title: GeneriqueListResponse
      properties:
        groupID:
          type: integer
          title: ID de groupe générique
        libelle:
          type: string
          title: Libellé de groupe générique
        medicaments:
          type: array
          items:
            $ref: "#/components/schemas/GeneriqueMedicament"
